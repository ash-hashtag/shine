# Builds and publishes a release when a version tag (v0.1.0, v1.2.3-rc.1…) is
# pushed. Tag only a finished version: see docs/development.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tag matches Cargo.toml and the library packages
        run: |
          for file in Cargo.toml bindings/Cargo.toml bindings/boltffi.toml; do
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$file" | head -1)
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the version in $file ($version)"
              exit 1
            fi
          done
      # The release notes are this version's section of docs/changelog.md.
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' docs/changelog.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::docs/changelog.md has no section for $version"
            exit 1
          fi
          cat notes.md
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: notes
          path: notes.md

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { name: linux-arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { name: macos-arm64, target: aarch64-apple-darwin, os: macos-15 }
          - { name: macos-x86_64, target: x86_64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - name: Build
        run: cargo build --release --locked --bins --target ${{ matrix.target }}
      # Archives have stable names (shine-linux-x86_64.tar.gz…) so the website
      # can link to releases/latest/download/<name>; the folder inside has
      # the version.
      - name: Package
        run: |
          dir="shine-$GITHUB_REF_NAME-${{ matrix.name }}"
          archive="shine-${{ matrix.name }}"
          exe=$([[ "${{ runner.os }}" == Windows ]] && echo .exe || true)
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/shine$exe" "target/${{ matrix.target }}/release/shine-mcp$exe" README.md LICENSE "$dir/"
          if [[ "${{ runner.os }}" == Windows ]]; then
            7z a "$archive.zip" "$dir" >/dev/null
          else
            tar czf "$archive.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.name }}
          path: shine-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          mv notes.md ../notes.md
          sha256sum shine-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          # v1.0.0-rc.1 and the like are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ---- the library: shine-photonics on PyPI and npm ------------------------------

  # Wheels for Python 3.10 to 3.14. Linux wheels are built in the manylinux
  # image and repaired by auditwheel, so they install on every current Linux.
  wheels-linux:
    name: Wheels ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, image: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, image: "quay.io/pypa/manylinux_2_28_aarch64" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust and BoltFFI
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install boltffi_cli --version 0.32.1 --locked
      - name: Wheels
        run: |
          pythons=""
          for v in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
            /opt/python/$v/bin/python -m pip install --quiet setuptools wheel
            pythons="$pythons /opt/python/$v/bin/python"
          done
          PYTHONS="$pythons" bindings/pack.sh --release python
          auditwheel repair --wheel-dir wheels bindings/dist/python/wheelhouse/*.whl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.name }}
          path: wheels/*.whl
          if-no-files-found: error

  wheels:
    name: Wheels ${{ matrix.name }} Python ${{ matrix.python }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        name: [windows-x86_64, macos-arm64, macos-x86_64]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { name: windows-x86_64, os: windows-2025 }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: wheels-${{ matrix.name }}
      - name: BoltFFI
        run: cargo install boltffi_cli --version 0.32.1 --locked
      - id: python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Wheel
        run: |
          python -m pip install --quiet setuptools wheel
          PYTHONS="${{ steps.python.outputs.python-path }}" bindings/pack.sh --release python
          mkdir wheels && cp bindings/dist/python/wheelhouse/*.whl wheels/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.name }}-${{ matrix.python }}
          path: wheels/*.whl
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [wheels-linux, wheels]
    runs-on: ubuntu-24.04
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - name: No token
        if: env.PYPI_API_TOKEN == ''
        run: |
          echo "::warning::PYPI_API_TOKEN isn't set in the repository's secrets; the wheels were built but not published"
      - uses: pypa/gh-action-pypi-publish@v1.12.4
        if: env.PYPI_API_TOKEN != ''
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheels
          skip-existing: true

  npm:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
      - name: BoltFFI and wasm-opt
        run: |
          cargo install boltffi_cli --version 0.32.1 --locked
          sudo apt-get update && sudo apt-get install -y binaryen
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: bindings/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Package
        run: bindings/pack.sh --release wasm
      - name: Test
        working-directory: bindings
        run: node --test test/
      - name: No token
        if: env.NODE_AUTH_TOKEN == ''
        run: |
          echo "::warning::NPM_TOKEN isn't set in the repository's secrets; the package was built but not published"
      - name: Publish
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish bindings/dist/wasm/pkg --access public
