# Tests, lints and builds: when a push to main changes Shine's version (a
# release is coming), on pull requests, and when run by hand (Actions → CI →
# Run workflow). Other pushes don't run it.
name: CI

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # A push that touches Cargo.toml without changing the version runs nothing.
  version:
    name: Version changed
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ $GITHUB_EVENT_NAME != push ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -1; }
          now=$(version < Cargo.toml)
          before=$(git show "$BEFORE:Cargo.toml" 2>/dev/null | version || true)
          echo "Version ${before:-?} → $now"
          if [[ $now != "$before" ]]; then echo "changed=true"; else echo "changed=false"; fi >> "$GITHUB_OUTPUT"

  test:
    needs: version
    if: needs.version.outputs.changed == 'true'
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings
      # Includes the headless UI tests and the docs coverage tests.
      - name: Test
        run: cargo test --locked
      # The solver and file format crates (crates/), on their own.
      - name: The solver and the file format
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked -p shine-solver -p shine-format --all-targets -- -D warnings
          cargo test --locked -p shine-solver -p shine-format
          cargo test --locked --no-default-features --lib
      # Designs, simulation and files without the editor: what the library and
      # the Python and TypeScript packages are built on.
      - name: The library without the editor
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked --no-default-features --features core,logging --all-targets -- -D warnings
          cargo test --locked --no-default-features --features core

  web:
    needs: version
    if: needs.version.outputs.changed == 'true'
    name: Web app, site and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
      # Must match the wasm-bindgen version in Cargo.lock.
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: wasm-bindgen@0.2.130
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web app and the site
        run: scripts/build-web.sh
      # Real mouse input in headless Chrome against the built app.
      - name: Browser tests
        run: scripts/e2e.sh
      - name: Screenshots of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-failures
          path: target/e2e-failures
          if-no-files-found: ignore

  library:
    needs: version
    if: needs.version.outputs.changed == 'true'
    name: Python and TypeScript packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      # wasm-opt as the release has it, so its options are checked here too.
      - name: BoltFFI and wasm-opt
        run: |
          cargo install boltffi_cli --version 0.32.1 --locked
          scripts/install-wasm-opt.sh
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install setuptools wheel
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: bindings/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: bindings/pnpm-lock.yaml
      - name: Lints
        run: cargo clippy --locked -p shine-photonics -- -D warnings
      - name: Build the wheel and the npm package
        run: bindings/pack.sh
      - name: Python tests
        run: |
          python -m pip install bindings/dist/python/wheelhouse/*.whl
          cd /tmp && python -m unittest discover -v -s "$GITHUB_WORKSPACE/bindings/tests"
      - name: TypeScript tests
        working-directory: bindings
        run: node --test test/*.test.mjs
