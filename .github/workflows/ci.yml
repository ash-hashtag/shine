# Tests, lints and builds on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings
      # Includes the headless UI tests and the docs coverage tests.
      - name: Test
        run: cargo test --locked
      - name: Library without the editor
        if: runner.os == 'Linux'
        run: cargo test --locked --no-default-features --lib

  web:
    name: Web app, site and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
      # Must match the wasm-bindgen version in Cargo.lock.
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: wasm-bindgen@0.2.130
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web app and the site
        run: scripts/build-web.sh
      # Real mouse input in headless Chrome against the built app.
      - name: Browser tests
        run: scripts/e2e.sh
      - name: Screenshots of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-failures
          path: target/e2e-failures
          if-no-files-found: ignore
