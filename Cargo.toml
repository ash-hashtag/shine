[package]
name = "shine"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui"]
# The editor. Disable with `default-features = false` to use only the `photonics` library.
gui = ["logging", "dep:egui", "dep:eframe", "dep:egui_plot", "dep:rfd"]
# Stderr + optional file logging setup for binaries.
logging = ["dep:tracing-subscriber", "dep:tracing-appender"]

[[bin]]
name = "shine"
required-features = ["gui"]

[[bin]]
name = "shine-mcp"
required-features = ["gui"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = { version = "0.37.0", features = ["serde"], optional = true }
eframe = { version = "0.37.0", features = ["serde"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rfd = { version = "0.18.0", optional = true }
num-complex = "0.4.6"
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
pulp = "0.22.3"
egui_plot = { version = "0.38.0", optional = true }
web-time = "1.1.0"
postcard = { version = "1.1.3", features = ["use-std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"
tracing-appender = { version = "0.2.5", optional = true }
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg", "rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
tracing-web = "0.1.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Location", "Url", "Window"] }
js-sys = "0.3"

# Used by scripts/build-web.sh for the browser build.
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
