[package]
name = "shine"
version = "0.1.2"
edition = "2024"
default-run = "shine"
description = "Photonic circuit simulator: design and simulate photonic circuits, from free-space optics to waveguide chips"
license = "GPL-3.0-only"
repository = "https://github.com/ash-hashtag/shine"
homepage = "https://shine.lupyd.com"

[workspace]
# The library's Python and TypeScript packages. They build Shine with only
# `core`, so they're left out of plain `cargo` commands here (which build the
# app); build them with `-p shine-photonics` or the boltffi tool in bindings/.
members = ["bindings"]
default-members = ["."]

[features]
default = ["gui"]
# Designs, simulation, analysis, files and exports, with no window: what the
# library (`shine::api`) and the Python and TypeScript packages use.
core = ["dep:emath", "dep:rust-rf", "dep:rquickjs", "dep:argmin", "dep:argmin-math"]
# The editor. Disable default features to use only the `photonics` engine, or
# use `core` for the library without the editor.
gui = ["core", "logging", "dep:mimalloc", "dep:egui", "dep:eframe", "dep:egui_plot", "dep:rfd", "dep:ehttp", "dep:png", "dep:egui_extras", "dep:image"]
# Stderr + optional file logging setup for binaries.
logging = ["dep:tracing-subscriber", "dep:tracing-appender"]

[[bin]]
name = "shine"
required-features = ["gui"]

[[bin]]
name = "shine-mcp"
required-features = ["gui"]

# Tests and examples of the app itself need the editor; the rest run on the
# library alone (`cargo test --no-default-features --features core`).
[[test]]
name = "ui"
required-features = ["gui"]

[[test]]
name = "crash"
required-features = ["gui"]

[[example]]
name = "frame_bench"
required-features = ["gui"]

[[example]]
name = "library_bench"
required-features = ["gui"]

[[example]]
name = "reference_design"
required-features = ["gui"]

[[example]]
name = "digits"
required-features = ["core", "logging"]

[[example]]
name = "mnist"
required-features = ["core", "logging"]

[[example]]
name = "scale_bench"
required-features = ["core", "logging"]

[[example]]
name = "sweep_bench"
required-features = ["core", "logging"]

[[example]]
name = "matmul"
required-features = ["logging"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = { version = "0.37.0", features = ["serde", "monochrome_emoji_fonts"], optional = true }
eframe = { version = "0.37.0", features = ["serde", "persistence"], optional = true }
# Points, vectors and rectangles of designs on the grid (the types egui uses).
emath = { version = "0.37.0", features = ["serde"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
rfd = { version = "0.18.0", optional = true }
num-complex = "0.4.6"
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
pulp = "0.22.3"
egui_plot = { version = "0.38.0", optional = true }
# Images of the canvas and plots.
png = { version = "0.18.1", optional = true }
# Component icons: draws WebP and SVG pictures (pure Rust, so the browser build works too).
egui_extras = { version = "0.37.0", default-features = false, features = ["svg", "webp"], optional = true }
# Component icons: reads the pictures people choose, scales them down and saves them as WebP.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"], optional = true }
web-time = "1.1.0"
postcard = { version = "1.1.3", features = ["use-std"] }
# Fast hashing of a project, every frame, to know when it changed.
foldhash = "0.2"
# Monte Carlo: seeded random variation (no OS entropy, so the browser build is fine).
rand = { version = "0.9.5", default-features = false, features = ["std", "std_rng"] }
rand_distr = { version = "0.5", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"
tracing-appender = { version = "0.2.5", optional = true }
# The desktop app's "Check for updates" (the browser app is always current).
ehttp = { version = "0.7.3", optional = true }
# Reading S-parameter files (Touchstone 1 and 2): a port of scikit-rf.
rust-rf = { version = "2.0.1", default-features = false, optional = true }
# Scripted components: the QuickJS JavaScript engine, sandboxed (desktop only).
rquickjs = { version = "0.14.0", features = ["parallel"], optional = true }
# Optimisation: Nelder–Mead from argmin (desktop only: its vectors need OS randomness).
argmin = { version = "0.11.0", default-features = false, optional = true }
argmin-math = { version = "0.5.1", default-features = false, features = ["vec"], optional = true }
# The app's and the MCP server's allocator: simulating big designs allocates
# from every thread, where it is markedly faster than the system's.
mimalloc = { version = "0.1.52", optional = true }
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg", "rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
tracing-web = "0.1.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Location", "Url", "Window"] }
js-sys = "0.3"

[dev-dependencies]
# Drives the UI by widget labels in tests (tests/ui.rs).
egui_kittest = "0.37.0"
mimalloc = "0.1.52"
# Reading your own digit in examples/mnist.rs.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
pprof = "0.15.0"

# Debug builds: quick to rebuild and quick enough to use. No debug info
# (backtraces still name functions); set `debug = true` here, or build with
# CARGO_PROFILE_DEV_DEBUG=true, when a debugger is needed. Dependencies are
# lightly optimised: built once, they make the debug app and tests much faster.
[profile.dev]
debug = false
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 1

# Used by scripts/build-web.sh for the browser build.
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
