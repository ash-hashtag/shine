[package]
name = "shine-format"
version = "0.1.3"
edition = "2024"
description = "Shine's file format: the Protocol Buffers schema of its projects, designs and components, and reading and writing them"
license = "GPL-3.0-only"
repository = "https://github.com/ash-hashtag/shine"
homepage = "https://shine.lupyd.com"

[dependencies]
quick-protobuf = "0.8.1"
# Big files are compressed with zlib (pure Rust, so the browser build works too).
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }

[build-dependencies]
# Rust types from proto/shine.proto, generated at build time.
pb-rs = { version = "0.10.0", default-features = false }
